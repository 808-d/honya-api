# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -f deployments/docker/Dockerfile -t duc1709/honya-api:latest .

      - name: Push image
        run: docker push duc1709/honya-api:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Deploy Honya
        run: /opt/honya/deploy.sh
