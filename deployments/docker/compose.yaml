services:
  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    image: honya-api:latest
    ports:
      - "8080:8080"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-123}@db:5432/${DB_NAME:-honya}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
    networks:
      - honya
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ../../migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-123}@db:5432/${DB_NAME:-honya}?sslmode=disable
      -       up
    networks:
      - honya
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    networks:
      - honya
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
      POSTGRES_DB: ${DB_NAME:-honya}
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    networks:
      - honya
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-honya}
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:

networks:
  honya:
    name: honya-network
    driver: bridge
