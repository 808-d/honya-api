version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/database/queries"
    schema: "migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake_case"
        emit_exact_table_names: true
        emit_empty_slices: true
        emit_exported_queries: true
        emit_interface: true
        emit_methods_with_db_argument: true
